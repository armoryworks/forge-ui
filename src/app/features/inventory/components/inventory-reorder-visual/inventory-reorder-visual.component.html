<div class="reorder-visual">
  @if (capped().length > 0) {
    @if (isCapped()) {
      <p class="reorder-visual__note">
        <span class="material-icons-outlined">info</span>
        {{ 'inventory.reorderVisual.topNNote' | translate: { count: capped().length, total: totalCount() } }}
      </p>
    }
    <div class="reorder-visual__chart" [style.height.px]="chartHeight()">
      <canvas baseChart
        [type]="chartConfig().type"
        [data]="chartConfig().data"
        [options]="chartConfig().options"
        [attr.aria-label]="'inventory.reorderVisual.chartLabel' | translate">
      </canvas>
    </div>
  } @else {
    <div class="reorder-visual__empty">
      <span class="material-icons-outlined">check_circle</span>
      <span>{{ 'inventory.reorderVisual.empty' | translate }}</span>
    </div>
  }
</div>
