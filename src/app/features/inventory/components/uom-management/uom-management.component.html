<div class="uom-management">
  <div class="uom-management__tabs">
    <button class="tab" [class.tab--active]="activeSection() === 'uoms'" (click)="switchSection('uoms')">
      {{ 'inventory.tabs.uom' | translate }}
    </button>
    <button class="tab" [class.tab--active]="activeSection() === 'conversions'" (click)="switchSection('conversions')">
      {{ 'inventory.uom.conversions' | translate }}
    </button>
  </div>

  @if (activeSection() === 'uoms') {
    <div class="uom-management__header">
      <button class="action-btn action-btn--create action-btn--sm" (click)="openCreateUom()">
        <span class="material-icons-outlined">add</span> {{ 'inventory.uom.newUom' | translate }}
      </button>
    </div>

    <div [appLoadingBlock]="loading()">
      <app-data-table
        tableId="uom-list"
        [columns]="uomColumns"
        [data]="uoms()"
        [clickableRows]="true"
        emptyIcon="straighten"
        [emptyMessage]="'inventory.uom.emptyUoms' | translate"
        (rowClick)="openEditUom($any($event))">
        <ng-template appColumnCell="isBaseUnit" let-row>
          @if (row.isBaseUnit) {
            <span class="material-icons-outlined" [attr.aria-label]="'inventory.uom.baseUnit' | translate">check</span>
          }
        </ng-template>
        <ng-template appColumnCell="actions" let-row>
          <button class="icon-btn" [attr.aria-label]="'inventory.uom.editUom' | translate" (click)="openEditUom(row); $event.stopPropagation()">
            <span class="material-icons-outlined">edit</span>
          </button>
        </ng-template>
      </app-data-table>
    </div>
  }

  @if (activeSection() === 'conversions') {
    <div class="uom-management__header">
      <button class="action-btn action-btn--create action-btn--sm" (click)="openCreateConversion()">
        <span class="material-icons-outlined">add</span> {{ 'inventory.uom.newConversion' | translate }}
      </button>
    </div>

    <div [appLoadingBlock]="loading()">
      <app-data-table
        tableId="uom-conversions"
        [columns]="conversionColumns"
        [data]="conversions()"
        emptyIcon="swap_horiz"
        [emptyMessage]="'inventory.uom.emptyConversions' | translate">
        <ng-template appColumnCell="isReversible" let-row>
          @if (row.isReversible) {
            <span class="material-icons-outlined" [attr.aria-label]="'inventory.uom.reversible' | translate">check</span>
          }
        </ng-template>
      </app-data-table>
    </div>
  }
</div>

<!-- UOM Dialog -->
@if (showUomDialog()) {
  <app-dialog [title]="(editingUom() ? 'inventory.uom.editTitle' : 'inventory.uom.newTitle') | translate" width="520px" (closed)="showUomDialog.set(false)">
    <div [formGroup]="uomForm">
      <div class="dialog-row">
        <app-input [label]="'inventory.uom.code' | translate" formControlName="code" [required]="true" [placeholder]="'inventory.uom.codePlaceholder' | translate" />
        <app-input [label]="'common.name' | translate" formControlName="name" [required]="true" [placeholder]="'inventory.uom.namePlaceholder' | translate" />
      </div>
      <div class="dialog-row">
        <app-select [label]="'common.category' | translate" formControlName="category" [options]="categoryOptions" [required]="true" />
        <app-input [label]="'inventory.uom.symbol' | translate" formControlName="symbol" [placeholder]="'inventory.uom.symbolPlaceholder' | translate" />
      </div>
      <div class="dialog-row">
        <app-input [label]="'inventory.uom.decimalPlaces' | translate" formControlName="decimalPlaces" type="number" [required]="true" />
        <app-input [label]="'inventory.uom.sortOrder' | translate" formControlName="sortOrder" type="number" />
      </div>
      <app-toggle [label]="'inventory.uom.baseForCategory' | translate" formControlName="isBaseUnit" />
    </div>

    <div dialog-footer>
      <button class="action-btn" (click)="showUomDialog.set(false)">{{ 'common.cancel' | translate }}</button>
      <app-validation-button [violations]="uomViolations" [loading]="saving()">
      <button class="action-btn action-btn--primary"
        [disabled]="uomForm.invalid || saving()"
        (click)="saveUom()">
        <span class="material-icons-outlined">save</span>
        {{ (editingUom() ? 'inventory.uom.update' : 'common.create') | translate }}
      </button>
      </app-validation-button>
    </div>
  </app-dialog>
}

<!-- Conversion Dialog -->
@if (showConversionDialog()) {
  <app-dialog [title]="'inventory.uom.newConversion' | translate" width="520px" (closed)="showConversionDialog.set(false)">
    <div [formGroup]="conversionForm">
      <div class="dialog-row">
        <app-select [label]="'inventory.uom.fromUom' | translate" formControlName="fromUomId" [options]="uomSelectOptions()" [required]="true" />
        <app-select [label]="'inventory.uom.toUom' | translate" formControlName="toUomId" [options]="uomSelectOptions()" [required]="true" />
      </div>
      <app-input [label]="'inventory.uom.conversionFactor' | translate" formControlName="conversionFactor" type="number" [required]="true"
        [placeholder]="'inventory.uom.factorPlaceholder' | translate" />
      <app-toggle [label]="'inventory.uom.reversibleToggle' | translate" formControlName="isReversible" />
    </div>

    <div dialog-footer>
      <button class="action-btn" (click)="showConversionDialog.set(false)">{{ 'common.cancel' | translate }}</button>
      <app-validation-button [violations]="conversionViolations" [loading]="saving()">
      <button class="action-btn action-btn--primary"
        [disabled]="conversionForm.invalid || saving()"
        (click)="saveConversion()">
        <span class="material-icons-outlined">save</span> {{ 'common.create' | translate }}
      </button>
      </app-validation-button>
    </div>
  </app-dialog>
}
