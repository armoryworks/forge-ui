<app-dialog [title]="'ppap.responseTitle' | translate: { number: data.submissionNumber }" width="480px" [dirty]="form.dirty" (closed)="close()">
  <div [formGroup]="form">
    <app-select [label]="'ppap.customerDecision' | translate" formControlName="customerDecision" [options]="decisionOptions" [required]="true" data-testid="ppap-response-decision" />
    <app-textarea [label]="'common.notes' | translate" formControlName="notes" [rows]="3" [maxlength]="2000" data-testid="ppap-response-notes" />
  </div>
  <div dialog-footer>
    <button class="action-btn" type="button" (click)="close()" data-testid="ppap-response-cancel-btn">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
      <button class="action-btn action-btn--primary" type="button" [disabled]="form.invalid || saving()" (click)="save()" data-testid="ppap-response-save-btn">
        {{ 'ppap.recordResponse' | translate }}
      </button>
    </app-validation-button>
  </div>
</app-dialog>
