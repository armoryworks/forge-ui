<div class="filters-bar">
  <app-select [label]="'common.type' | translate" [formControl]="typeFilter" [options]="typeOptions" (selectionChange)="loadCapas()" />
  <app-select [label]="'common.status' | translate" [formControl]="statusFilter" [options]="statusOptions" (selectionChange)="loadCapas()" />
</div>

<div [appLoadingBlock]="loading()">
  <app-data-table tableId="capa-list" [columns]="columns" [data]="capas()"
    [clickableRows]="true" (rowClick)="openDetail($event)"
    emptyIcon="assignment_turned_in" [emptyMessage]="'quality.capaList.noCorrectiveActionsFound' | translate">
    <ng-template appColumnCell="capaNumber" let-row>
      <span class="capa-list__number">{{ row.capaNumber }}</span>
    </ng-template>
    <ng-template appColumnCell="type" let-row>
      <span class="chip chip--muted">{{ row.type | enumLabel }}</span>
    </ng-template>
    <ng-template appColumnCell="priority" let-row>
      <span [class]="getPriorityClass(row.priority)">{{ row.priority | enumLabel }}</span>
    </ng-template>
    <ng-template appColumnCell="status" let-row>
      <span [class]="getStatusClass(row.status)">{{ row.status | enumLabel }}</span>
    </ng-template>
    <ng-template appColumnCell="dueDate" let-row>
      {{ row.dueDate | dateOnly }}
    </ng-template>
    <ng-template appColumnCell="tasks" let-row>
      {{ row.completedTaskCount }}/{{ row.taskCount }}
    </ng-template>
    <ng-template appColumnCell="actions" let-row>
      @if (canManage && row.status !== 'Closed') {
        <button class="icon-btn" [attr.aria-label]="'capas.advance' | translate"
          [matTooltip]="'capas.advance' | translate" matTooltipPosition="above"
          (click)="advancePhase(row); $event.stopPropagation()">
          <span class="material-icons-outlined" aria-hidden="true">arrow_forward</span>
        </button>
      }
    </ng-template>
  </app-data-table>
</div>

@if (showCreateDialog()) {
  <app-dialog [title]="'quality.capaList.createCapa' | translate" width="520px" (closed)="showCreateDialog.set(false)">
    <div [formGroup]="createForm">
      <div class="dialog-row">
        <app-select [label]="'common.type' | translate" formControlName="type" [options]="typeOptions.slice(1)" [required]="true" />
        <app-select [label]="'quality.capaList.source' | translate" formControlName="sourceType" [options]="sourceTypeOptions" [required]="true" />
      </div>
      <app-input [label]="'common.title' | translate" formControlName="title" [required]="true" />
      <app-textarea [label]="'quality.capaList.problemDescription' | translate" formControlName="problemDescription" [required]="true" />
      <app-textarea [label]="'quality.capaList.impactDescription' | translate" formControlName="impactDescription" />
      <div class="dialog-row">
        <app-select [label]="'capas.owner' | translate" formControlName="ownerId" [options]="userOptions()" [required]="true"
          data-testid="capa-create-owner" />
        <app-select [label]="'common.priority' | translate" formControlName="priority" [options]="priorityOptions" />
      </div>
      <app-datepicker [label]="'common.dueDate' | translate" formControlName="dueDate" />
    </div>
    <div dialog-footer>
      <button class="action-btn" (click)="showCreateDialog.set(false)">{{ 'common.cancel' | translate }}</button>
      <app-validation-button [violations]="createViolations" [loading]="saving()">
      <button class="action-btn action-btn--primary"
        [disabled]="createForm.invalid || saving()"
        (click)="saveCapa()">{{ 'common.create' | translate }}</button>
      </app-validation-button>
    </div>
  </app-dialog>
}

@if (openCapaId(); as capaId) {
  <app-capa-detail-dialog [capaId]="capaId" [userOptions]="userOptions()"
    (closed)="openCapaId.set(null)" (changed)="loadCapas()" />
}
