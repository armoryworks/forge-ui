<div [appLoadingBlock]="loading()">
  <app-data-table tableId="spc-characteristics" [columns]="columns" [data]="characteristics()"
    [clickableRows]="true" emptyIcon="straighten" [emptyMessage]="'spc.characteristics.empty' | translate"
    (rowClick)="selectCharacteristic($any($event))">
    <ng-template appColumnCell="operationName" let-row>
      <span class="text-muted">{{ row.operationName ?? '—' }}</span>
    </ng-template>
    <ng-template appColumnCell="specLimits" let-row>
      <span class="spc-char__spec">{{ row.lowerSpecLimit }} — {{ row.upperSpecLimit }}</span>
    </ng-template>
    <ng-template appColumnCell="measurementCount" let-row>
      {{ row.measurementCount }}
    </ng-template>
    <ng-template appColumnCell="latestCpk" let-row>
      @if (row.latestCpk !== null) {
        <span class="spc-char__cpk" [class]="getCpkClass(row.latestCpk)">{{ row.latestCpk | number:'1.2-2' }}</span>
      } @else {
        <span class="text-muted">—</span>
      }
    </ng-template>
    <ng-template appColumnCell="isActive" let-row>
      <span class="material-icons-outlined" [style.color]="row.isActive ? 'var(--success)' : 'var(--text-muted)'">
        {{ row.isActive ? 'check_circle' : 'cancel' }}
      </span>
    </ng-template>
    <ng-template appColumnCell="actions" let-row>
      <button class="icon-btn" [attr.aria-label]="'spc.characteristics.edit' | translate" (click)="openEdit(row); $event.stopPropagation()">
        <span class="material-icons-outlined">edit</span>
      </button>
    </ng-template>
  </app-data-table>
</div>

@if (showDialog()) {
  <app-dialog [title]="(editingId() ? 'spc.characteristics.editTitle' : 'spc.characteristics.newTitle') | translate" width="520px" (closed)="closeDialog()">
    <div [formGroup]="form">
      <div class="dialog-row">
        <app-entity-picker data-testid="spc-char-part"
          [label]="'spc.characteristics.part' | translate"
          entityType="parts"
          displayField="partNumber"
          secondaryDisplayField="name"
          formControlName="partId"
          [placeholder]="editingPartNumber()" />
        @if (operationOptions().length) {
          <app-select data-testid="spc-char-operation"
            [label]="'spc.characteristics.operation' | translate"
            formControlName="operationId"
            [options]="operationOptions()" />
        }
      </div>

      <app-input [label]="'common.name' | translate" formControlName="name" [required]="true" data-testid="spc-char-name" />
      <app-textarea [label]="'common.description' | translate" formControlName="description" data-testid="spc-char-description" />

      <app-select [label]="'spc.characteristics.measurementType' | translate" formControlName="measurementType"
        [options]="measurementTypeOptions" data-testid="spc-char-measurement-type" />

      <div class="dialog-row">
        <app-input [label]="'spc.characteristics.nominalValue' | translate" type="number" formControlName="nominalValue"
          [required]="true" data-testid="spc-char-nominal" />
        <app-input [label]="'spc.characteristics.unitOfMeasure' | translate" formControlName="unitOfMeasure"
          data-testid="spc-char-uom" />
      </div>

      <div class="dialog-row">
        <app-input [label]="'spc.characteristics.lowerSpecLimit' | translate" type="number" formControlName="lowerSpecLimit"
          [required]="true" data-testid="spc-char-lsl" />
        <app-input [label]="'spc.characteristics.upperSpecLimit' | translate" type="number" formControlName="upperSpecLimit"
          [required]="true" data-testid="spc-char-usl" />
      </div>

      <div class="dialog-row">
        <app-input [label]="'spc.characteristics.sampleSize' | translate" type="number" formControlName="sampleSize"
          [required]="true" data-testid="spc-char-sample-size" />
        <app-input [label]="'spc.characteristics.decimalPlaces' | translate" type="number" formControlName="decimalPlaces"
          [required]="true" data-testid="spc-char-decimal-places" />
      </div>

      <app-input [label]="'spc.characteristics.sampleFrequency' | translate" formControlName="sampleFrequency"
        [placeholder]="'spc.characteristics.sampleFrequencyPlaceholder' | translate" data-testid="spc-char-sample-frequency" />

      <div class="dialog-row">
        <app-toggle [label]="'spc.characteristics.notifyOnOoc' | translate" formControlName="notifyOnOoc"
          data-testid="spc-char-notify-ooc" />
        <app-toggle [label]="'common.active' | translate" formControlName="isActive" data-testid="spc-char-active" />
      </div>
    </div>

    <div dialog-footer>
      <button class="action-btn" (click)="closeDialog()">{{ 'common.cancel' | translate }}</button>
      <app-validation-button [violations]="violations" [loading]="saving()">
      <button class="action-btn action-btn--primary" data-testid="spc-char-save"
        [disabled]="form.invalid || saving()"
        (click)="save()">{{ (editingId() ? 'spc.characteristics.update' : 'common.create') | translate }}</button>
      </app-validation-button>
    </div>
  </app-dialog>
}
