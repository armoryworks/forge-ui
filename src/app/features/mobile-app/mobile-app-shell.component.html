<div class="app-shell">
  <header class="app-shell__header">
    <span class="app-shell__logo">Forge</span>
    <app-sync-indicator class="app-shell__sync" />
    <app-language-toggle class="app-shell__lang" />
    <a
      class="app-shell__gear"
      routerLink="/app/account"
      routerLinkActive="app-shell__gear--active"
      [attr.aria-label]="'mobileApp.account.title' | translate"
      data-testid="mobile-app-account"
    >
      <span class="material-icons-outlined" aria-hidden="true">settings</span>
    </a>
  </header>

  <main class="app-shell__content">
    <router-outlet />
  </main>

  @if (timer.active()) {
    <div class="app-shell__timer" data-testid="mobile-app-timer-strip">
      <span class="material-icons-outlined app-shell__timer-icon" aria-hidden="true">timer</span>
      <span class="app-shell__timer-text">
        {{ 'mobileApp.timer.running' | translate: { jobNumber: runningLabel(), elapsed: elapsed() } }}
      </span>
      <button
        type="button"
        class="app-shell__timer-stop"
        [disabled]="stopping()"
        data-testid="mobile-app-timer-stop"
        (click)="stopTimer()"
      >
        <span class="material-icons-outlined" aria-hidden="true">stop</span>
        {{ 'mobileApp.timer.stop' | translate }}
      </button>
    </div>
  }

  <nav class="app-shell__nav" [attr.aria-label]="'mobileApp.navLabel' | translate">
    @for (tab of tabs(); track tab.path) {
      <a
        class="app-shell__tab"
        [routerLink]="tab.path"
        routerLinkActive="app-shell__tab--active"
        [attr.data-testid]="'mobile-app-tab-' + tab.icon"
      >
        <span class="material-icons-outlined app-shell__tab-icon" aria-hidden="true">{{ tab.icon }}</span>
        <span class="app-shell__tab-label">{{ tab.labelKey | translate }}</span>
      </a>
    }
  </nav>
</div>
