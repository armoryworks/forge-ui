<div class="app-scan" data-testid="mobile-app-scan-placeholder">
  <div class="app-scan__frame" aria-hidden="true">
    <span class="app-scan__corner app-scan__corner--tl"></span>
    <span class="app-scan__corner app-scan__corner--tr"></span>
    <span class="app-scan__corner app-scan__corner--bl"></span>
    <span class="app-scan__corner app-scan__corner--br"></span>
  </div>
  <p class="app-scan__hint">{{ 'mobileApp.scan.placeholder' | translate }}</p>
</div>
