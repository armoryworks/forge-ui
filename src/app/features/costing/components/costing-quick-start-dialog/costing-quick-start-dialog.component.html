<app-dialog [title]="'costing.quickStart.title' | translate" width="520px" (closed)="cancel()">
  <p class="quick-start__lead">{{ 'costing.quickStart.lead' | translate }}</p>

  <div [formGroup]="form">
    <div class="dialog-row">
      <app-input [label]="'costing.quickStart.fiscalYear' | translate" type="number"
        formControlName="fiscalYear" [required]="true" data-testid="qs-fiscal-year" />
      <app-input [label]="'costing.quickStart.headcount' | translate" type="number"
        formControlName="directHeadcount" [required]="true" data-testid="qs-headcount" />
    </div>
    <div class="dialog-row">
      <app-currency-input [label]="'costing.quickStart.wage' | translate"
        formControlName="averageHourlyWage" [required]="true" data-testid="qs-wage" />
      <app-input [label]="'costing.quickStart.payrollTax' | translate" type="number"
        formControlName="payrollTaxPercent" suffix="%" data-testid="qs-payroll-tax" />
    </div>
    <div class="dialog-row">
      <app-currency-input [label]="'costing.quickStart.benefits' | translate"
        formControlName="benefitsMonthlyPerEmployee" data-testid="qs-benefits" />
      <app-currency-input [label]="'costing.quickStart.utilities' | translate"
        formControlName="utilitiesMonthly" data-testid="qs-utilities" />
    </div>
    <div class="dialog-row">
      <app-currency-input [label]="'costing.quickStart.facilities' | translate"
        formControlName="facilitiesMonthly" data-testid="qs-facilities" />
      <app-currency-input [label]="'costing.quickStart.equipment' | translate"
        formControlName="equipmentAnnual" data-testid="qs-equipment" />
    </div>
    <app-toggle [label]="'costing.quickStart.createGlBudgets' | translate"
      formControlName="createGlBudgets" data-testid="qs-gl-budgets" />
    <app-toggle [label]="'costing.quickStart.setLaborRates' | translate"
      formControlName="setDefaultLaborRates" data-testid="qs-labor-rates" />

    @if (error()) {
      <p class="quick-start__error">{{ 'costing.quickStart.failed' | translate }}</p>
    }
  </div>

  <div dialog-footer>
    <button class="action-btn" (click)="cancel()" data-testid="qs-cancel">
      {{ 'common.cancel' | translate }}
    </button>
    <app-validation-button [violations]="violations" [loading]="saving()">
      <button class="action-btn action-btn--primary" [disabled]="form.invalid || saving()"
        (click)="apply()" data-testid="qs-apply">
        {{ 'costing.quickStart.apply' | translate }}
      </button>
    </app-validation-button>
  </div>
</app-dialog>
