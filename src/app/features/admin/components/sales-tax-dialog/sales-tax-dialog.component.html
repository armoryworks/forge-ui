<app-dialog
  [title]="isEditing ? ('salesTax.editRate' | translate) : ('salesTax.addRate' | translate)"
  width="480px"
  [draftConfig]="draftConfig"
  [draftFormGroup]="form"
  (closed)="close()">

  <div [formGroup]="form">
    <div class="dialog-row">
      <app-input [label]="'common.name' | translate" formControlName="name" [required]="true"
        [attr.aria-label]="'salesTax.fieldName' | translate" />
      <app-input [label]="'salesTax.fieldCode' | translate" formControlName="code" [required]="true"
        [placeholder]="'salesTax.eGCaSales' | translate"
        [attr.aria-label]="'salesTax.fieldCode' | translate" />
    </div>

    <div class="dialog-row">
      <app-select [label]="'common.state' | translate" formControlName="stateCode" [options]="stateOptions"
        [attr.aria-label]="'salesTax.stateCode' | translate" />
      <app-input
        [label]="'salesTax.fieldRate' | translate"
        type="number"
        formControlName="ratePercent"
        [required]="true"
        placeholder="e.g. 8.25"
        [attr.aria-label]="'salesTax.fieldRate' | translate" />
    </div>

    <app-datepicker [label]="'salesTax.effectiveFrom' | translate" formControlName="effectiveFrom" [attr.aria-label]="'salesTax.effectiveFromDate' | translate" />

    <app-textarea
      [label]="'salesTax.descriptionOptional' | translate"
      formControlName="description"
      [rows]="2"
      [attr.aria-label]="'salesTax.fieldDescription' | translate" />

    <app-toggle
      [label]="'salesTax.setAsDefaultRate' | translate"
      formControlName="isDefault"
      [attr.aria-label]="'salesTax.fieldDefault' | translate" />

    <!-- Phase 3 F5 — full-record fields. exemptFlag flags this row as an
         exemption marker (local concern); glPostingAccount is optional and
         populated by the external accounting sync when configured. -->
    <app-toggle
      [label]="'salesTax.exemptRate' | translate"
      formControlName="exemptFlag"
      data-testid="sales-tax-exempt-flag" />

    <app-input
      [label]="'salesTax.glPostingAccountOptional' | translate"
      formControlName="glPostingAccount"
      [placeholder]="'salesTax.eG2200SalesTax' | translate"
      data-testid="sales-tax-gl-posting-account" />
  </div>

  <div dialog-footer>
    <button class="action-btn" (click)="close()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
    <button class="action-btn action-btn--primary"
      [disabled]="form.invalid || saving()"
      (click)="save()">
      @if (saving()) {
        <span class="material-icons-outlined account-page__spinner">sync</span>
      } @else {
        <span class="material-icons-outlined">save</span>
      }
      {{ 'common.save' | translate }}
    </button>
    </app-validation-button>
  </div>
</app-dialog>
