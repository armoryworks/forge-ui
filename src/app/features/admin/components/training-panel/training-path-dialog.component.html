<app-dialog [title]="isEditing ? 'Edit Training Path' : 'New Training Path'" width="600px" [draftConfig]="draftConfig" [draftFormGroup]="form" (closed)="cancel()">

  <div [formGroup]="form">
    <app-input data-testid="path-title" [label]="'common.title' | translate" formControlName="title" [required]="true" [maxlength]="200" />

    <app-input data-testid="path-slug" [label]="'admin.trainingPathDialog.slug' | translate" formControlName="slug" [maxlength]="200"
      placeholder="auto-generated-from-title" />

    <app-textarea data-testid="path-description" [label]="'common.description' | translate" formControlName="description" [rows]="2" [maxlength]="500" />

    <app-input data-testid="path-icon" [label]="'admin.trainingPathDialog.icon' | translate" formControlName="icon"
      placeholder="school" />

    <div class="toggle-group">
      <app-toggle data-testid="path-auto-assign" [label]="'admin.trainingPathDialog.autoAssignToNewUsers' | translate" formControlName="isAutoAssigned" />
      <app-toggle data-testid="path-active" [label]="'common.active' | translate" formControlName="isActive" />
    </div>
  </div>

  <div dialog-footer>
    <button class="action-btn" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
    <button class="action-btn action-btn--primary" data-testid="path-save-btn"
      [disabled]="form.invalid || saving()"
      (click)="save()">
      <span class="material-icons-outlined">save</span>
      {{ isEditing ? 'Save Changes' : 'Create Path' }}
    </button>
    </app-validation-button>
  </div>
</app-dialog>
