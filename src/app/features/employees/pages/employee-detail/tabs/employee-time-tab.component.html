<div class="tab-toolbar">
  <app-select [label]="'employees.employeeTimeTab.period' | translate" [formControl]="periodControl" [options]="periodOptions"
    (selectionChange)="onPeriodChange()" />
  <span class="tab-toolbar__spacer"></span>
</div>

<div class="tab-content tab-content--table">
  <app-data-table
    tableId="employee-time"
    [columns]="columns"
    [data]="entries()"
    [loading]="loading()"
    emptyIcon="schedule"
    [emptyMessage]="'employees.employeeTimeTab.noTimeEntriesFound' | translate" />
</div>
