<app-dialog [title]="'subcontractUi.sendOutTitle' | translate: { step: data.operation.stepNumber, title: data.operation.title }" width="480px" (closed)="matDialogRef.close()">
  <div [formGroup]="formGroup">
    <app-input [label]="'subcontractUi.vendor' | translate" formControlName="vendorName" [isReadonly]="true" data-testid="subcontract-send-out-vendor" />
    <div class="dialog-row">
      <app-input [label]="'subcontractUi.quantity' | translate" formControlName="quantity" type="number" [min]="0" [required]="true" data-testid="subcontract-send-out-quantity" />
      <app-datepicker [label]="'subcontractUi.expectedReturn' | translate" formControlName="expectedReturnDate" [min]="minReturnDate" data-testid="subcontract-send-out-return-date" />
    </div>
    <app-toggle [label]="'subcontractUi.createDraftPo' | translate" formControlName="createPurchaseOrder" data-testid="subcontract-send-out-create-po" />
    @if (formGroup.controls.createPurchaseOrder.value) {
      <p class="text-muted" data-testid="subcontract-send-out-price-hint">
        @if (data.operation.subcontractCost !== null) {
          {{ 'subcontractUi.poPriceKnown' | translate: { price: (data.operation.subcontractCost | currency) } }}
        } @else {
          {{ 'subcontractUi.poPriceUnknown' | translate }}
        }
      </p>
    }
  </div>

  <div dialog-footer>
    <button type="button" class="action-btn" (click)="matDialogRef.close()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
      <button type="button" class="action-btn action-btn--primary" data-testid="subcontract-send-out-save"
        [disabled]="formGroup.invalid || saving()"
        (click)="save()">{{ 'subcontractUi.sendOut' | translate }}</button>
    </app-validation-button>
  </div>
</app-dialog>
