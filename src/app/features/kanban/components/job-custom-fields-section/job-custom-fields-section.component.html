@if (definitions().length > 0) {
  <div class="jd-section" data-testid="job-custom-fields">
    <div class="jd-section__header">
      <h3 class="jd-section__title">{{ 'kanban.customFields.title' | translate }}</h3>
    </div>
    <div class="custom-fields" [formGroup]="form()">
      @for (def of definitions(); track def.key) {
        @switch (def.type) {
          @case ('number') {
            <app-input [label]="def.label" type="number" [formControlName]="def.key" [required]="def.isRequired" [attr.data-testid]="'job-cf-' + def.key" />
          }
          @case ('date') {
            <app-datepicker [label]="def.label" [formControlName]="def.key" [required]="def.isRequired" [attr.data-testid]="'job-cf-' + def.key" />
          }
          @case ('select') {
            <app-select [label]="def.label" [formControlName]="def.key" [options]="selectOptions()[def.key] ?? []" [required]="def.isRequired" [attr.data-testid]="'job-cf-' + def.key" />
          }
          @case ('toggle') {
            <app-toggle [label]="def.label" [formControlName]="def.key" [attr.data-testid]="'job-cf-' + def.key" />
          }
          @default {
            <app-input [label]="def.label" [formControlName]="def.key" [required]="def.isRequired" [attr.data-testid]="'job-cf-' + def.key" />
          }
        }
      }
      <div class="custom-fields__actions">
        <button class="action-btn action-btn--primary action-btn--sm" (click)="save()" [disabled]="form().invalid || saving()" data-testid="job-cf-save-btn">
          <span class="material-icons-outlined">save</span>
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </div>
}
