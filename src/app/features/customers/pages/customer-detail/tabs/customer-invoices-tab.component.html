@if (canDownloadStatement) {
  <div class="tab-toolbar">
    <span class="tab-toolbar__spacer"></span>
    <button class="action-btn action-btn--sm" data-testid="customer-statement-btn"
            [disabled]="downloadingStatement()" (click)="downloadStatement()">
      <span class="material-icons-outlined">picture_as_pdf</span>
      {{ 'customers.tabs.downloadStatement' | translate }}
    </button>
  </div>
}

<div class="tab-content tab-content--table">
  <app-data-table
    tableId="customer-invoices"
    [columns]="columns"
    [data]="invoices()"
    [loading]="loading()"
    emptyIcon="receipt_long"
    [emptyMessage]="'customers.tabs.noInvoicesYet' | translate"
    [clickableRows]="true"
    (rowClick)="openInvoice($any($event))">

    <ng-template appColumnCell="status" let-row>
      <span class="chip" [class]="getStatusClass($any(row).status)">{{ $any(row).status }}</span>
    </ng-template>

    <ng-template appColumnCell="total" let-row><app-currency-display [value]="$any(row).total" [currency]="null" /></ng-template>

    <ng-template appColumnCell="dueDate" let-row>
      {{ $any(row).dueDate | dateOnly }}
    </ng-template>

    <ng-template appColumnCell="createdAt" let-row>
      {{ $any(row).createdAt | date:'MM/dd/yyyy' }}
    </ng-template>
  </app-data-table>
</div>
