<app-dialog [title]="title()" width="520px" (closed)="close()">
  <div [formGroup]="form">
    @if (needsCustomerSelection()) {
      <app-entity-picker
        [label]="'customers.contactDialog.customerField' | translate"
        entityType="customers"
        displayField="name"
        secondaryDisplayField="companyName"
        formControlName="customerId"
        [required]="true"
        data-testid="contact-customer-picker" />
    }
    <div class="dialog-row">
      <app-input data-testid="contact-first-name" [label]="'customers.firstName' | translate" formControlName="firstName" [required]="true" />
      <app-input data-testid="contact-last-name" [label]="'customers.lastName' | translate" formControlName="lastName" [required]="true" />
    </div>
    <div class="dialog-row">
      <app-input data-testid="contact-email" [label]="'customers.colEmail' | translate" formControlName="email" type="email" />
      <app-input data-testid="contact-phone" [label]="'customers.colPhone' | translate" formControlName="phone" mask="phone" />
    </div>
    <div class="dialog-row">
      <app-select data-testid="contact-role" [label]="'customers.role' | translate" formControlName="role" [options]="roleOptions()" />
      <app-toggle data-testid="contact-primary" [label]="'customers.primaryContact' | translate" formControlName="isPrimary" />
    </div>
  </div>
  <div dialog-footer>
    <button class="action-btn" (click)="close()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
      <button class="action-btn action-btn--primary" data-testid="contact-save-btn"
        [disabled]="form.invalid || saving()"
        (click)="save()">{{ 'common.save' | translate }}</button>
    </app-validation-button>
  </div>
</app-dialog>
