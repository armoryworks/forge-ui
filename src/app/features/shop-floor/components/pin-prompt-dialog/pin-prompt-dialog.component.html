<div class="pin-dialog">
  <div class="pin-dialog__header">
    <span class="material-icons-outlined pin-dialog__icon">lock</span>
    <h2 class="pin-dialog__title">{{ title }}</h2>
  </div>

  @if (error(); as err) {
    <div class="pin-dialog__error">
      <span class="material-icons-outlined">warning</span>
      {{ err }}
    </div>
  }

  <div class="pin-dialog__field">
    <input
      type="password"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="6"
      [formControl]="pinControl"
      [placeholder]="'kioskFlows.pin.placeholder' | translate"
      class="pin-dialog__input"
      [attr.aria-label]="'kioskFlows.pin.aria' | translate"
      data-testid="pin-prompt-input"
      (keydown.enter)="confirm()" />
  </div>

  <div class="pin-dialog__actions">
    <button class="action-btn pin-dialog__btn" (click)="cancel()" [attr.aria-label]="'common.cancel' | translate">
      <span class="material-icons-outlined">close</span>
      {{ 'common.cancel' | translate }}
    </button>
    <button class="action-btn action-btn--primary pin-dialog__btn"
            [disabled]="pinControl.invalid"
            (click)="confirm()"
            [attr.aria-label]="'kioskFlows.pin.confirmAria' | translate">
      <span class="material-icons-outlined">check</span>
      {{ 'common.confirm' | translate }}
    </button>
  </div>
</div>
