<app-dialog
  [title]="'lots.newLot' | translate"
  width="520px"
  [draftConfig]="draftConfig"
  [draftFormGroup]="lotForm"
  (closed)="close()">

  <div [formGroup]="lotForm">
    <app-entity-picker #partPicker
      [label]="'lots.fieldPart' | translate"
      entityType="parts"
      displayField="partNumber"
      secondaryDisplayField="name"
      formControlName="partId"
      [required]="true"
      [createNewLabel]="('parts.part' | translate).toLowerCase()"
      (createNew)="onCreateNewPart($event)"
      data-testid="lot-part"
      [attr.aria-label]="'lots.fieldPart' | translate" />

    <app-input
      [label]="'lots.lotNumber' | translate"
      formControlName="lotNumber"
      [placeholder]="'lots.lotNumberPlaceholder' | translate"
      data-testid="lot-number"
      [attr.aria-label]="'lots.lotNumber' | translate" />

    <div class="dialog-row">
      <app-input
        [label]="'lots.fieldQuantity' | translate"
        type="number"
        formControlName="quantity"
        [required]="true"
        step="0.0001"
        min="0.0001"
        data-testid="lot-quantity"
        [attr.aria-label]="'lots.fieldQuantity' | translate" />

      <app-input
        [label]="'lots.fieldSupplierLot' | translate"
        formControlName="supplierLotNumber"
        [placeholder]="'common.optional' | translate"
        data-testid="lot-supplier-number"
        [attr.aria-label]="'lots.fieldSupplierLot' | translate" />
    </div>

    <div class="dialog-row">
      <app-entity-picker
        [label]="'lots.fieldLinkedJobOptional' | translate"
        entityType="jobs"
        displayField="jobNumber"
        secondaryDisplayField="title"
        formControlName="jobId"
        data-testid="lot-job"
        [attr.aria-label]="'lots.fieldJob' | translate" />

      <app-datepicker
        [label]="'lots.fieldExpirationOptional' | translate"
        formControlName="expirationDate"
        data-testid="lot-expiration"
        [attr.aria-label]="'lots.fieldExpiration' | translate" />
    </div>

    <app-textarea
      [label]="'lots.fieldNotesOptional' | translate"
      formControlName="notes"
      [rows]="2"
      data-testid="lot-notes"
      [attr.aria-label]="'lots.fieldNotes' | translate" />
  </div>

  <div dialog-footer>
    <button class="action-btn" (click)="close()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
    <button class="action-btn action-btn--primary"
      data-testid="lot-save-btn"
      [disabled]="lotForm.invalid || saving()"
      (click)="save()">
      @if (saving()) {
        <span class="material-icons-outlined account-page__spinner">sync</span>
      } @else {
        <span class="material-icons-outlined">save</span>
      }
      {{ 'common.save' | translate }}
    </button>
    </app-validation-button>
  </div>
</app-dialog>
