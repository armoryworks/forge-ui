<app-dialog [title]="'pickWaves.generate.title' | translate" width="440px" (closed)="closed.emit()">
  <div class="generate" [formGroup]="form">
    <p class="generate__hint">{{ 'pickWaves.generate.hint' | translate }}</p>
    <app-select [label]="'pickWaves.generate.strategy' | translate" formControlName="strategy" [options]="strategyOptions"
      [required]="true" data-testid="pick-wave-generate-strategy" />
    <app-datepicker [label]="'pickWaves.generate.shipBy' | translate" formControlName="shipBy" data-testid="pick-wave-generate-ship-by" />
    <app-input [label]="'pickWaves.generate.maxLines' | translate" type="number" formControlName="maxLines" [required]="true"
      min="1" max="500" data-testid="pick-wave-generate-max-lines" />
  </div>
  <div dialog-footer>
    <button class="action-btn" type="button" (click)="closed.emit()">{{ 'common.cancel' | translate }}</button>
    <app-validation-button [violations]="violations" [loading]="saving()">
      <button class="action-btn action-btn--primary" type="button" [disabled]="form.invalid || saving()"
        data-testid="pick-wave-generate-submit" (click)="generate()">
        <span class="material-icons-outlined" aria-hidden="true">auto_awesome_motion</span>
        {{ 'pickWaves.generate.action' | translate }}
      </button>
    </app-validation-button>
  </div>
</app-dialog>
