<a class="skip-link" href="#main-content">{{ 'shared.skipToContent' | translate }}</a>
@if (showShell()) {
  <app-header [attr.inert]="isGlobalLoading() || null" />
  <app-connection-banner [attr.inert]="isGlobalLoading() || null" />
  <app-announcement-overlay [attr.inert]="isGlobalLoading() || null" />
  <app-onboarding-banner [attr.inert]="isGlobalLoading() || null" />
  <div class="app-body" [attr.inert]="isGlobalLoading() || null">
    @if (layout.sidebarVisible()) {
      @if (layout.isMobile()) {
        <div class="mobile-sidebar-backdrop" aria-hidden="true"></div>
      }
      <app-sidebar />
    }
    <main class="app-main" id="main-content">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="app-standalone" id="main-content" [attr.inert]="isGlobalLoading() || null">
    <router-outlet />
  </main>
}

<app-offline-banner />
<app-loading-overlay />
<app-toast-container />
<app-keyboard-shortcuts-help />
<app-chat-preview-popup />
<app-demo-marker />
<app-demo-module-switcher />
<app-upgrade-lock />
