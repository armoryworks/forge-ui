<a class="skip-link" href="#main-content">{{ 'shared.skipToContent' | translate }}</a>
@if (showShell()) {
  <div class="app-shell" [attr.inert]="isGlobalLoading() || null">
    <app-header />
    <app-connection-banner />
    <app-announcement-overlay />
    <app-mfa-grace-banner />
    <app-onboarding-banner />
    <div class="app-body">
      @if (layout.sidebarVisible()) {
        @if (layout.isMobile()) {
          <div class="mobile-sidebar-backdrop" aria-hidden="true"></div>
        }
        <app-sidebar />
      }
      <main class="app-main" id="main-content">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <main class="app-standalone" id="main-content" [attr.inert]="isGlobalLoading() || null">
    <router-outlet />
  </main>
}

<app-offline-banner />
<app-loading-overlay />
<app-toast-container />
<app-keyboard-shortcuts-help />
<app-chat-preview-popup [attr.inert]="isGlobalLoading() || null" />
<app-demo-marker />
<app-demo-module-switcher [attr.inert]="isGlobalLoading() || null" />
<app-upgrade-lock />
