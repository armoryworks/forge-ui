<div class="date-range">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'common.from' | translate }}</mat-label>
    <input matInput
      [matDatepicker]="startPicker"
      [min]="min()"
      [max]="endDate() ?? max()"
      [disabled]="disabled()"
      [value]="startDate()"
      (dateChange)="onStartChange($event)"
      (blur)="markTouched()" />
    <mat-datepicker-toggle matSuffix [for]="startPicker" />
    <mat-datepicker #startPicker />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'common.to' | translate }}</mat-label>
    <input matInput
      [matDatepicker]="endPicker"
      [min]="startDate() ?? min()"
      [max]="max()"
      [disabled]="disabled()"
      [value]="endDate()"
      (dateChange)="onEndChange($event)"
      (blur)="markTouched()" />
    <mat-datepicker-toggle matSuffix [for]="endPicker" />
    <mat-datepicker #endPicker />
  </mat-form-field>

  @if (presets().length) {
    <div class="date-range__presets">
      @for (preset of presets(); track preset) {
        <button
          class="date-range__preset"
          [disabled]="disabled()"
          (click)="applyPreset(preset)">
          {{ presetKey(preset) | translate }}
        </button>
      }
    </div>
  }
</div>
@if (errorMessage(); as message) {
  <span class="date-range__error" role="alert" data-testid="date-range-error">{{ message }}</span>
}
