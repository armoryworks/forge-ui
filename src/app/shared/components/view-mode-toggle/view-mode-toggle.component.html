<div class="view-mode-toggle" role="group" [attr.aria-label]="'common.viewMode' | translate">
  @for (option of options(); track option.mode) {
    <button
      type="button"
      class="view-mode-toggle__btn"
      [class.view-mode-toggle__btn--active]="mode() === option.mode"
      [attr.aria-pressed]="mode() === option.mode"
      [attr.data-testid]="'view-mode-' + option.mode"
      (click)="select(option.mode)">
      <span class="material-icons-outlined">{{ option.icon }}</span>
      <span class="view-mode-toggle__label">{{ option.labelKey | translate }}</span>
    </button>
  }
</div>
