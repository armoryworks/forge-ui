<div class="detail-load-error" role="alert" data-testid="detail-load-error">
  <app-empty-state
    [icon]="view().icon"
    [message]="view().message | translate"
    [helpText]="view().help | translate"
    [actionLabel]="(offersRetry() ? 'detailLoadError.retry' : closeLabel()) | translate"
    (action)="act()" />
</div>
