<mat-form-field appearance="outline" [class.app-readonly-field]="isReadonly()">
  <mat-label>{{ label() }}</mat-label>
  @if (prefix() && prefix().length <= 2) {
    <span matPrefix class="input__text-prefix">{{ prefix() }}</span>
  } @else if (prefix()) {
    <span matPrefix class="material-icons-outlined input__icon-prefix" aria-hidden="true">{{ prefix() }}</span>
  }
  <input matInput #field
    [type]="effectiveType"
    [attr.inputmode]="inputMode"
    [placeholder]="placeholder()"
    [readonly]="isReadonly()"
    [required]="required()"
    [attr.maxlength]="effectiveMaxlength"
    [autocomplete]="autocomplete()"
    [disabled]="disabled()"
    [errorStateMatcher]="errorStateMatcher"
    (input)="onInput($event)"
    (blur)="onBlur()" />
  @if (type() === 'password') {
    <button matSuffix type="button" class="input__password-toggle"
      data-testid="password-toggle"
      (click)="toggleShowPassword()"
      [attr.aria-pressed]="showPassword()"
      [attr.aria-label]="(showPassword() ? 'shared.hidePassword' : 'shared.showPassword') | translate">
      <span class="material-icons-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
    </button>
  }
  @if (suffix()) {
    <span matSuffix>&nbsp;{{ suffix() }}</span>
  }
  @if (info()) {
    <span matSuffix class="material-icons-outlined info-icon"
      [matTooltip]="info()" matTooltipPosition="above">info</span>
  }
</mat-form-field>
@if (errorMessage(); as message) {
  <span class="input__error" role="alert" data-testid="input-error">{{ message }}</span>
}
