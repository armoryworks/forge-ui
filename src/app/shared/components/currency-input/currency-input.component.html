<mat-form-field appearance="outline" class="currency-input" [class.app-readonly-field]="isReadonly()">
  <mat-label>{{ label() }}</mat-label>
  <span matTextPrefix class="currency-input__symbol" aria-hidden="true">{{ currencySymbol() }}&nbsp;</span>
  <input matInput #field
    type="text"
    [attr.inputmode]="inputMode"
    [placeholder]="placeholder()"
    [required]="isRequired()"
    [errorStateMatcher]="errorStateMatcher"
    [readonly]="isReadonly()"
    [disabled]="disabled()"
    [attr.aria-description]="calcHint()"
    (input)="onInput($event)"
    (keydown.enter)="onEnter()"
    (blur)="onBlur()" />
  @if (showCalcHint()) {
    <span matSuffix class="material-icons-outlined currency-input__calc-hint" data-testid="currency-input-calc-hint"
      aria-hidden="true" [matTooltip]="calcHint() ?? ''" matTooltipPosition="above">calculate</span>
  }
</mat-form-field>
@if (errorMessage(); as message) {
  <span class="currency-input__error" role="alert" data-testid="currency-input-error">{{ message }}</span>
}
