@if (show) {
  <div class="demo-switcher">
    @if (open()) {
      <div class="demo-switcher__panel" role="dialog" [attr.aria-label]="'shared.demoModuleSwitcher.demoModuleSwitcher' | translate">
        <div class="demo-switcher__head">
          <span class="demo-switcher__title">{{ 'shared.demoModuleSwitcher.demoModules' | translate }}</span>
          <button type="button" class="demo-switcher__close" [attr.aria-label]="'common.close' | translate" (click)="togglePanel()">
            <span class="material-icons-outlined">close</span>
          </button>
        </div>
        <p class="demo-switcher__hint">{{ 'shared.demoModuleSwitcher.switchWhatSTurnedOnTo' | translate }}</p>

        <div class="demo-switcher__presets">
          <button type="button" class="demo-switcher__preset" (click)="selectFull()">{{ 'shared.demoModuleSwitcher.fullSuite' | translate }}</button>
          <button type="button" class="demo-switcher__preset" (click)="selectInventory()">{{ 'shared.demoModuleSwitcher.inventoryOnly' | translate }}</button>
        </div>

        <ul class="demo-switcher__list">
          @for (m of rows(); track m.id) {
            <li>
              <button type="button" class="demo-switcher__item" [class.demo-switcher__item--on]="m.on"
                [attr.aria-pressed]="m.on" (click)="toggleModule(m.id)">
                <span class="material-icons-outlined demo-switcher__check">
                  {{ m.on ? 'check_box' : 'check_box_outline_blank' }}
                </span>
                <span class="demo-switcher__item-name">{{ m.name }}</span>
                @if (m.preview) {
                  <span class="demo-switcher__tag">{{ 'shared.demoModuleSwitcher.preview' | translate }}</span>
                }
              </button>
            </li>
          }
        </ul>
      </div>
    }

    <button type="button" class="demo-switcher__chip" (click)="togglePanel()" [attr.aria-expanded]="open()">
      <span class="material-icons-outlined">tune</span>
      <span class="demo-switcher__chip-label">{{ 'shared.demoModuleSwitcher.modulesSummary' | translate:{ summary: summary() } }}</span>
    </button>
  </div>
}
