<mat-form-field appearance="outline" [class.app-readonly-field]="isReadonly()">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }
  <textarea matInput
    [rows]="rows()"
    [attr.maxlength]="maxlength()"
    [attr.placeholder]="placeholder() || null"
    [attr.aria-label]="label() ? null : ariaLabel()"
    [readonly]="isReadonly()"
    [required]="isRequired()"
    [errorStateMatcher]="errorStateMatcher"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="markTouched()">
  </textarea>
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
@if (errorMessage(); as message) {
  <span class="textarea__error" role="alert" data-testid="textarea-error">{{ message }}</span>
}
