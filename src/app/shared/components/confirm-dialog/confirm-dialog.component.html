<div class="confirm-dialog">
  <div class="confirm-dialog__header">
    <span class="confirm-dialog__title">{{ data.title }}</span>
    <button class="icon-btn" aria-label="Close" matTooltip="Close" matTooltipPosition="above" (click)="cancel()">
      <span class="material-icons-outlined">close</span>
    </button>
  </div>

  <div class="confirm-dialog__body">
    <p class="confirm-dialog__message">{{ data.message }}</p>
    @if (data.details?.length) {
      <ul class="confirm-dialog__details" data-testid="confirm-dialog-details">
        @for (detail of data.details; track $index) {
          <li>{{ detail }}</li>
        }
      </ul>
    }
  </div>

  <div class="confirm-dialog__footer">
    <button class="action-btn" (click)="cancel()">{{ cancelLabel }}</button>
    <button
      class="action-btn"
      [class.action-btn--primary]="severity === 'info'"
      [class.action-btn--warn]="severity === 'warn'"
      [class.action-btn--destructive]="severity === 'danger'"
      (click)="confirm()">
      {{ confirmLabel }}
    </button>
  </div>
</div>
