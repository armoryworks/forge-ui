<div class="dialog-backdrop" role="button" tabindex="0" [attr.aria-label]="'common.dismiss' | translate" (click)="dismiss()" (keydown.enter)="dismiss()">
  <div class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title" style="width: 520px" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="dialog__header">
      <span class="dialog__title">{{ title }}</span>
      <button class="icon-btn" [attr.aria-label]="'common.close' | translate" (click)="dismiss()">
        <span class="material-icons-outlined">close</span>
      </button>
    </div>

    <div class="dialog__body">
      <p class="draft-prompt__description">{{ description }}</p>

      <div class="draft-prompt__list">
        @for (draft of data.drafts; track draft.key) {
          <div class="draft-prompt__item">
            <div class="draft-prompt__item-info">
              <span class="draft-prompt__item-label">{{ draft.displayLabel }}</span>
              <span class="draft-prompt__item-time">{{ draft.lastModified | date:'MM/dd/yyyy hh:mm a' }}</span>
            </div>
            <button class="action-btn action-btn--sm" [attr.aria-label]="'shared.draftRecoveryPrompt.goToDisplaylabel' | translate:{ displayLabel: draft.displayLabel }" (click)="navigateTo(draft)">
              <span class="material-icons-outlined">open_in_new</span>
              {{ 'shared.draftRecoveryPrompt.goTo' | translate }}
            </button>
          </div>
        }
      </div>
    </div>

    <div class="dialog__footer">
      @if (data.mode === 'expiry') {
        <button class="action-btn" (click)="keepAll()">{{ 'shared.draftRecoveryPrompt.keepAll' | translate }}</button>
      }
      <button class="action-btn" (click)="discardAll()">{{ 'shared.draftRecoveryPrompt.discardAll' | translate }}</button>
      <button class="action-btn action-btn--primary" (click)="dismiss()">{{ 'shared.draftRecoveryPrompt.reviewLater' | translate }}</button>
    </div>
  </div>
</div>
