@if (visible()) {
  <div class="draft-banner" role="status">
    <span class="material-icons-outlined draft-banner__icon">restore</span>
    <span class="draft-banner__text">
      {{ 'shared.draftRecoveryBanner.recoveredUnsavedChangesFromTimestamp' | translate:{ timestamp: (timestamp() | dateTime) } }}
    </span>
    <button class="draft-banner__action" [attr.aria-label]="'shared.draftRecoveryBanner.discardRecoveredDraft' | translate" (click)="discarded.emit()">
      {{ 'shared.draftRecoveryBanner.discard' | translate }}
    </button>
  </div>
}
